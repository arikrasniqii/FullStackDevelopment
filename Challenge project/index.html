<h2>Slideshow</h2>

        <div class="slide">

        </div>

        <div class="slide">

        </div>

        <div class="slide">
            <img src="Taj_Mahal.jpeg" width="400">

<h2>Facts About the 7 Wonders</h2>

<select id="wonderSelect" onchange="showFact()">
    <option value="">Select a wonder</option>
    <option value="greatwall">Great Wall of China</option>
    <option value="petra">Petra</option>
    <option value="redeemer">Christ the Redeemer</option>
    <option value="machu">Machu Picchu</option>
    <option value="chichen">Chichen Itza</option>
    <option value="colosseum">Colosseum</option>
    <option value="taj">Taj Mahal</option>
</select>

<p id="factText"></p>
